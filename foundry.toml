[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "pauser/=lib/pauser/src/",
    "phoenix-nft-staking/=lib/phoenix-nft-staking/src/",
    # phoenix-nft-staking's own remappings.txt resolves "yield-claim-nft/" to its
    # (uninitialised) lib/mutable/yield-claim-nft copy. This repo *is* yield-claim-nft,
    # so point those imports at our own sources.
    "yield-claim-nft/=src/"
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Mainnet-fork RPC for PromotionUniV2_Eth.t.sol (the repo's first fork test). Set MAINNET_RPC_URL
# to an ARCHIVE endpoint (Alchemy/Infura) — the pinned FORK_BLOCK requires historical state that
# free full-nodes do not serve. With neither MAINNET_RPC_URL nor RPC_MAINNET set, the fork suites
# (PromotionUniV2_Eth.t.sol, UniPoolerV2.fork.t.sol) skip cleanly.
[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
